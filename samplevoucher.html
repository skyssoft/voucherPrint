<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Words Converter</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --readonly-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 5px 40px;
            border-radius: 12px;
            
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
        }

        .header h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px 0;
            vertical-align: middle;
        }

        td:first-child {
            width: 30%;
        }

        label {
            font-weight: 600;
            color: black;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[readonly] {
            background-color: var(--readonly-bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        /* PDF display container hidden styling */
        #pdf-content {
            display: none;
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="color: rgb(0, 0, 0); font-weight: 500; padding-left: 50px; text-align:  center;"  > Quick Links>>>
				
				<a href="https://skyssoft.github.io/dummyTCform/"; target="_blank"><input type="button" class="button-3" value="Easy T C  Print";> </a>
				<a href="https://skyssoft.github.io/SampleSeatingArrangement/", target="_blank"><input type="button" class="button-3" value="Exam Seating Arrangement";></a>
				<span style="color: rgb(112, 11, 41); text-align: right; font-size: 25 px;">Contact: 9526455151 </span>
				</div>
                <br>
    <div class="header">
        <h1>Sample Arts & Science College</h1>
        <h2>Make Voucher</h2>
    </div>

    <form id="form-print" enctype="text/plain">
        <table>
            <tr>
                <td><label for="VoucherNumber">Voucher Number</label></td>
                <td><input type="text" id="VoucherNumber" name="VoucherNumber" placeholder="e.g. VCH-001"></td>
            </tr>
            <tr>
                <td><label for="date">Enter Date</label></td>
                <td><input type="date" id="date" name="date"></td>
            </tr>
            <tr>
                <td><label for="amount">Enter Amount</label></td>
                <td><input type="number" id="amount" name="amount" placeholder="0" min="0" max="99999" oninput="convertNumberToWords()"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="text" id="amtwords" name="amtwords" placeholder="Amount in words" readonly></td>
            </tr>
            <tr>
                <td><label for="payto">Pay to</label></td>
                <td><input type="text" id="payto" name="payto" placeholder="Recipient Name"></td>
            </tr>
            <tr>
                <td><label for="being">Being</label></td>
                <td><input type="text" id="being" name="being" placeholder="Purpose of payment"></td>
            </tr>
        </table>
        <button type="button" class="btn-primary" onclick="GeneratePdf()">Make Voucher</button>
    </form>

    <!-- Div to display PDF content before generating -->
    <div id="pdf-content"></div>
</div>

<script>
function convertNumberToWords() {
    const num = document.getElementById('amount').value;
    if (num === "" || isNaN(num) || num < 0 || num >= 100000) {
        document.getElementById('amtwords').value = "Please enter a valid number between 0 and 99,999.";
        return;
    }
    document.getElementById('amtwords').value = numberToWords(parseInt(num)) + " Only";
}

function numberToWords(n) {
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
    const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

    function belowHundred(num) {
        if (num < 10) return ones[num];
        else if (num >= 10 && num < 20) return teens[num - 10];
        else {
            const tenVal = tens[Math.floor(num / 10)];
            const oneVal = ones[num % 10];
            return tenVal + (oneVal ? " " + oneVal : "");
        }
    }

    function belowThousand(num) {
        if (num < 100) return belowHundred(num);
        else {
            const hundredVal = ones[Math.floor(num / 100)] + " Hundred";
            const rest = num % 100;
            return hundredVal + (rest ? " " + belowHundred(rest) : "");
        }
    }

    if (n === 0) return "Zero";
    if (n < 1000) return belowThousand(n);

    let thousandPart = Math.floor(n / 1000);
    let hundredPart = n % 1000;
    let result = belowThousand(thousandPart) + " Thousand";
    if (hundredPart > 0) {
        result += " " + belowThousand(hundredPart);
    }
    return result.trim();
}

function formatDateToDdMmYyyy(date) {
    if (!date || isNaN(date.getTime())) {
        return "Invalid Date";
    }
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return `${day}/${month}/${year}`;
}

function GeneratePdf() {
    const voucherno = document.getElementById('VoucherNumber').value;
    const dateValue = document.getElementById('date').value;
    const voucherdate = dateValue ? formatDateToDdMmYyyy(new Date(dateValue)) : "Invalid Date";
    const voucheramount = document.getElementById('amount').value;
    const amountwords = document.getElementById('amtwords').value;
    const name = document.getElementById('payto').value;
    const voucherbeing = document.getElementById('being').value;

    const pdfContent = `
        <div style="padding: 20px; font-family: Arial, sans-serif;">
            <div style="text-align: center; padding-top:20px">
                <h1 style="margin: 0; font-size: 22px;">Sample Arts & Science College</h1>
                <h5 style="margin: 5px 0; font-weight: normal; color: #555;">Affiliated to the University ..</h5>
                <h4 style="margin: 5px 0; font-weight: normal; color: #555;">College Address</h4>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <hr style="border: 0; border-top: 1px solid #000;">
                <h2 style="margin-top: 15px;"><strong>VOUCHER</strong></h2>
            </div>
            <div style="position: relative; width: 100%; height: 110px; margin-top: 20px;">
                <div style="width: 45%; text-align: left; position: absolute; top: 0; right: 0; box-sizing: border-box;">
                    <p style="margin: 4px 0;"><strong>Voucher Number :</strong> ${voucherno}</p>
                    <p style="margin: 4px 0;"><strong>Date&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp; :</strong> ${voucherdate}</p>
                    <p style="margin: 4px 0;"><strong>Amount &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;:</strong> ${voucheramount}</p>
                </div>
            </div>
            <div>
                <p style="padding-left:20px; padding-right:20px; line-height: 1.8;">Pay to : <strong>${name}</strong></p>
                <p style="padding-left:20px; padding-right:20px; line-height: 1.8;">Rupees (in words) : <strong>${amountwords}</strong></p>
                <p style="padding-left:20px; padding-right:20px; line-height: 1.8;">Being : <strong>${voucherbeing}</strong></p>
            </div>
            <br><br>
            <div>
                <table style="padding-left:20px; padding-right:20px; width: 100%; font-size: 14px;">
                    <tr>
                        <td>Approved by: ..............................</td>
                        <td></td>
                        <td>Paid by: .............................</td>
                        <td>Revenue Stamp</td>
                    </tr>
                    <tr><td colspan="4"><br><br></td></tr>
                    <tr>
                        <td>Drawn on : .................................</td>
                        <td></td>
                        <td>Cash/cheque........................</td>
                        <td>Receiver's Signature</td>
                    </tr>
                </table>
            </div>
        </div>
    `;

    const pdfElement = document.getElementById('pdf-content');
    pdfElement.innerHTML = pdfContent;
    pdfElement.style.display = 'block';

    setTimeout(() => {
        html2pdf()
            .from(pdfElement)
            .set({
                margin: 0.5,
                filename: 'voucher.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'in', format: 'letter' }
            })
            .save()
            .then(() => {
                pdfElement.style.display = 'none';
            })
            .catch(error => {
                console.error("Error generating PDF:", error);
                alert("An error occurred while generating the PDF. Please try again.");
            });
    }, 500);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</body>
</html>
